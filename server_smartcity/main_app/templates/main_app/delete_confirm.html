{% extends 'main_app/base.html' %}

{% block content %}

<div class="alert alert-danger">
    <h4>Yakin ingin menghapus?</h4>
    <p>{{ object.title }}</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Hapus</button>
    <a href="{% url 'report_list' %}" class="btn btn-secondary">Batal</a>
</form>

{% endblock %}
